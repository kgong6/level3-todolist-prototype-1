<!DOCTYPE html>
<html>
  
  <head>
    <title>Your To-do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script type="text/javascript" src="{{ url_for('static', filename='js/main.js') }}"> </script>
    
  </head>

  
  <body>

    <h1>
      To-Do:
    </h1>
    
    
    <div id="remove_items">
      <form action="/remove_items" method="POST">
        {% for item in todo_items %}
        <input type="checkbox" name="check" id="{{item}}" value="{{item}}" onchange="check_me('{{item}}')">
        <label for="{{items}}" name = "{{item}}">{{ item }}</label><br>

        {% endfor %}
        <input type="submit" value = "CHECK ITEMS" id="remove_btn">
        
      </form>
    </div>


    <!-- ADD ITEMS FORM -->
    <div id="add_item">
      <form action = "/add_items" method ="POST">
        <select name = "select_items">
          {% for item in all_items %}
          <option value="{{ item }}">{{ item }}</option>
          {% endfor %}
          <input type="submit" value="+" id="add_btn">
        
      </form>
    </div>
    
    
  </body>
  
</html>
